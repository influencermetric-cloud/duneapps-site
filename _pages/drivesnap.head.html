{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[
 {"@type":"Question","name":"Does DriveSnap upload my location?","acceptedAnswer":{"@type":"Answer","text":"No. Drives are detected, measured and stored on your iPhone. There is no account and no DriveSnap server. The only network request the app can make is to Apple's Maps for the tiles behind a route thumbnail, and that can be switched off in Settings, after which the app makes no network requests at all."}},
 {"@type":"Question","name":"Is there a limit on free drives?","acceptedAnswer":{"@type":"Answer","text":"No. Tracking, classifying and browsing your full history are free and unlimited, permanently. Many mileage apps cap free users at around 40 drives a month. DriveSnap Pro unlocks the CSV export and the year-end tax report."}},
 {"@type":"Question","name":"How much does DriveSnap cost?","acceptedAnswer":{"@type":"Answer","text":"Version 1.0 is free in full — tracking, classifying, history, the CSV export and the year-end tax report, with no account and nothing to buy. A paid tier arrives in a later update; tracking stays free either way."}},
 {"@type":"Question","name":"What mileage rate does DriveSnap use?","acceptedAnswer":{"@type":"Answer","text":"You set the rate yourself, in your own currency and in miles or kilometres. It defaults to the US standard business rate, which for the second half of 2026 is $0.76 per mile. The rate in force is stamped onto each drive when it is recorded, so updating it next year never changes a tax year you have already filed."}},
 {"@type":"Question","name":"Can I use DriveSnap for a CRA logbook in Canada?","acceptedAnswer":{"@type":"Answer","text":"Only if you are an employee claiming a per-kilometre reimbursement. Self-employed Canadians must use the actual-expense method, which requires odometer readings at the start and end of the year. DriveSnap does not do that, and we would rather say so than take the download."}},
 {"@type":"Question","name":"What happens to my drives if I lose my phone?","acceptedAnswer":{"@type":"Answer","text":"DriveSnap can save a complete backup file containing every drive, its route and the rate it was costed at. Restoring only ever adds drives; it never replaces what is already there. There is no cloud sync, so keeping that backup somewhere safe is worth doing."}},
 {"@type":"Question","name":"Does DriveSnap drain the battery?","acceptedAnswer":{"@type":"Answer","text":"It uses the significant-location and motion services the system already runs, rather than holding GPS open continuously. With auto-detection off it uses no location services at all and you add drives by hand."}}]}
